<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Antigüedad de saldos</title><style>
:root{--primary:#3B1D4A;--secondary:#7B3F93;--accent:#C9A24A;--background:#F8F5F9;--button:#E4D4EA}
body{margin:0;background:var(--background);color:var(--primary);font:14px 'Segoe UI',Tahoma,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--primary);color:var(--background);border-bottom:5px solid var(--accent)}header img{max-height:76px;max-width:180px;object-fit:contain}main{max-width:900px;margin:28px auto;padding:24px;background:var(--background);border:2px solid var(--button);border-radius:10px}h1{font:italic bold 24px 'Lucida Fax',serif;color:var(--primary)}h2{font:18px 'Lucida Fax',serif;color:var(--secondary)}.tag{display:inline-block;padding:5px 10px;background:var(--accent);color:var(--primary);border-radius:12px}
</style></head><body><header><img src="imagenes/logoEmpresa.png" alt="Embutidos de Calidad S.A."><span class="tag">Ventas y Cuentas por Cobrar</span><img src="imagenes/mascotaVentas.png" alt="Mascota de la empresa"></header><main><h1>Antigüedad de saldos</h1><p>Indique fecha de corte y filtros. Revise la vista previa antes de imprimir o exportar.</p><h2>Recomendación</h2><p>Verifique los datos y los importes antes de confirmar. Si aparece un error, corrija los campos señalados y vuelva a intentarlo.</p></main></body></html>
